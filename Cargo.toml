[package]
name = "osmo360"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", version = "0.4.0" }
wgpu = "30.0.1"
winit = "0.30.13"
