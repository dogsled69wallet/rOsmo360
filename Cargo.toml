[package]
name = "rosmo360"
version = "0.2.10"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
# Text overlays: iced's own text engine (the same version), for laying out
# and drawing text into pictures.
cosmic-text = "0.15.0"
cpal = "0.18"
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
native-theme = { version = "0.6.1", features = ["native", "watch"] }
native-theme-iced = { version = "0.6.1", default-features = false, features = ["advanced-shaping"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", version = "0.4.0" }

# The desktop portal's colour scheme and accent, which a Flatpak sandbox can
# read where native-theme's files and gsettings are hidden (already built for
# native-theme, with these features).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
