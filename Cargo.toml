[package]
name = "rosmo360"
version = "0.2.7"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18"
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
native-theme = { version = "0.6.1", features = ["native", "watch"] }
native-theme-iced = { version = "0.6.1", default-features = false, features = ["advanced-shaping"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", version = "0.4.0" }
