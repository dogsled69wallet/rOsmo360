# The Flatpak: the release binary (built on Ubuntu 22.04 by build-release.sh) with
# an ffmpeg of its own, since a sandbox can't use the system's. Built against the
# runtime's libva, Vulkan loader and libdrm, it keeps the GPU decoders that
# full-res stills and export need; the GL extensions bring the drivers (Mesa,
# NVIDIA). GPL with x264 for MP4 export, never nonfree. No clang in the SDK, so
# no scale_cuda: CUDA decode is skipped and Vulkan or VA-API used.
app-id: io.github.ravelund.rOsmo360
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: rosmo360-launch
rename-desktop-file: rOsmo360.desktop
rename-icon: rosmo360
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Footage lives anywhere (a media disk, a NAS mount), and projects name their
  # clips by real paths, so the portal's per-file access isn't enough.
  - --filesystem=host
modules:
  - name: nv-codec-headers
    no-autogen: true
    make-install-args: [PREFIX=/app]
    cleanup: ['*']
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n13.0.19.1
        commit: ee1c8a8cdb05f733ca661c30fd50c74f94ad6937

  - name: x264
    config-opts: [--enable-static, --disable-cli, --enable-pic]
    cleanup: ['*']
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-libx264
      - --enable-vaapi
      - --enable-vulkan
      - --enable-ffnvcodec
      - --enable-nvdec
      - --disable-ffplay
      - --disable-doc
      - --disable-debug
    cleanup: [/include, /lib/pkgconfig, /share/ffmpeg/examples, '*.a']
    post-install:
      - install -Dm644 -t /app/share/licenses/ffmpeg COPYING.GPLv2 LICENSE.md
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
        sha256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e

  - name: rosmo360
    buildsystem: simple
    build-commands:
      - install -Dm755 rosmo360 /app/bin/rosmo360
      - install -Dm755 launch.sh /app/bin/rosmo360-launch
      - install -Dm644 rOsmo360.desktop /app/share/applications/rOsmo360.desktop
      - install -Dm644 rosmo360.svg /app/share/icons/hicolor/scalable/apps/rosmo360.svg
      - install -Dm644 rosmo360.png /app/share/icons/hicolor/256x256/apps/rosmo360.png
      - install -Dm644 io.github.ravelund.rOsmo360.metainfo.xml /app/share/metainfo/io.github.ravelund.rOsmo360.metainfo.xml
      - install -Dm644 -t /app/share/licenses/rosmo360 LICENSE-MIT LICENSE-APACHE
      # The built-in fonts are inside the binary; their licences beside it.
      - for d in fonts/*/; do install -Dm644 -t /app/share/licenses/rosmo360/fonts/$(basename $d) $d*.txt; done
      - install -Dm644 -t /app/share/licenses/rosmo360/fonts fonts/README.md
    sources:
      - type: file
        path: ../../target/jammy/release/rosmo360
      - type: file
        path: launch.sh
      - type: file
        path: ../rOsmo360.desktop
      - type: file
        path: ../rosmo360.svg
      - type: file
        path: ../rosmo360.png
      - type: file
        path: io.github.ravelund.rOsmo360.metainfo.xml
      - type: file
        path: ../../LICENSE-MIT
      - type: file
        path: ../../LICENSE-APACHE
      - type: dir
        path: ../../fonts
        dest: fonts
